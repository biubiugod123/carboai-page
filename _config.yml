# GitHub Pages (Jekyll) — keep build sources and repo docs out of the published site.
# Adding a .nojekyll file would disable this and republish tools/ (the gate script names vendors the site never mentions).
exclude:
  - tools
  - docs
  - README.md
  # Internal notes on where the demo photos came from — never a public URL
  - assets/demo/SOURCES.md
  # Jekyll's own defaults — a user exclude: list replaces them
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
